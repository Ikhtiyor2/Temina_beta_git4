{% load static %}
<!DOCTYPE html>
<html lang="{{ current_lang|default:'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140f1c">
  <title>Temina — Твой фитнес-ритм</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/miniapp.css' %}?v=bot15">
  <link rel="stylesheet" href="{% static 'css/miniapp-onboarding.css' %}?v=1">
  <link rel="preload" as="image" href="{% static 'img/onboarding/slide-1.webp' %}">
  <link rel="stylesheet" href="{% static 'css/temina-camera-pose.css' %}?v=bot12">
  <link rel="prefetch" href="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js">
  <link rel="prefetch" href="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js">
  <link rel="prefetch" href="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js">
  <style>
    :root {
      --splat-pink: url("{% static 'img/splat-pink.png' %}");
      --splat-violet: url("{% static 'img/splat-violet.png' %}");
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body data-debug="{% if debug %}1{% else %}0{% endif %}" data-athlete="{% static 'img/temina-athlete.jpg' %}" data-workout="{% static 'img/temina-workout.jpg' %}">
  <section id="teminaIntro" class="temina-intro" role="dialog" aria-modal="true" aria-label="Знакомство с Temina" data-images="{% static 'img/onboarding/' %}" hidden>
    <div class="intro-stage">
      <img class="intro-photo" alt="" draggable="false">
      <img class="intro-photo" alt="" draggable="false">
      <img class="intro-photo" alt="" draggable="false">
      <img class="intro-photo" alt="" draggable="false">
      <div class="intro-shade"></div>
      <div class="intro-top">
        <div class="intro-progress" aria-hidden="true"></div>
        <div class="intro-topline"><span class="intro-brand"><b>//</b> TEMINA.</span><button type="button" class="intro-skip">Пропустить</button></div>
      </div>
      <div class="intro-copy">
        <div class="intro-meta"><span class="intro-kicker"></span><span class="intro-count"></span></div>
        <div aria-live="polite" aria-atomic="true"><h2 class="intro-title"></h2><p class="intro-description"></p></div>
        <div class="intro-actions">
          <button type="button" class="intro-back" aria-label="Назад">←</button>
          <button type="button" class="intro-next"><span>Дальше</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
        </div>
        <p class="intro-hint"></p>
      </div>
    </div>
  </section>
  <div id="gate" class="gate">
    <div class="wordmark"><span class="brand-slashes">//</span>TEMINA<span class="dot">.</span></div>
    <h1 id="gateTitle" data-i18n="gate.enter">Входим</h1>
    <p id="gateText" class="muted" data-i18n="gate.checking">Проверяем сессию Telegram.</p>
    <button id="gateRetry" class="sport-button" type="button" hidden data-i18n="gate.retry">Повторить</button>
    <a id="gateDemo" class="sport-button ghost" href="/quick-login/?next=/app/" hidden data-i18n="gate.demo">Демо-вход</a>
  </div>

  <div id="shell" class="app-shell" hidden>
    <header class="topbar">
      <div class="wordmark"><span class="brand-slashes">//</span>TEMINA<span class="dot">.</span></div>
      <span class="desktop-date"></span>
      <div class="top-actions">
        <span class="demo-label" data-i18n="chrome.account">АККАУНТ</span>
        <button id="back" class="icon-control" type="button" hidden data-i18n-aria="chrome.back" aria-label="Назад">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </button>
        <button class="icon-control" type="button" data-go="search" data-i18n-aria="chrome.search" aria-label="Поиск">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button class="icon-control" type="button" data-go="stats" data-id="calories" data-i18n-aria="chrome.alerts" aria-label="Уведомления">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
          <span class="notification-dot"></span>
        </button>
        <button class="avatar" type="button" data-go="profile" data-i18n-aria="chrome.me" aria-label="Мой профиль" data-i18n="chrome.you">ТЫ</button>
      </div>
    </header>
    <h1 id="title" class="sr-only">Главная</h1>
    <main id="screen" class="entrance"></main>
    <nav class="bottom-nav" aria-label="Основная навигация">
      <div class="nav-inner">
        <button type="button" data-tab="home" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span data-i18n="nav.home">Главная</span>
        </button>
        <button type="button" data-tab="trainings" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 0 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/></svg>
          <span data-i18n="nav.trainings">Тренировки</span>
        </button>
        <button type="button" data-tab="competitions" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978"/><path d="M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978"/><path d="M18 9h1.5a1 1 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"/><path d="M6 9H4.5a1 1 0 0 1 0-5H6"/></svg>
          <span data-i18n="nav.competitions">Соревнования</span>
        </button>
        <button type="button" data-tab="profile" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
          <span data-i18n="nav.profile">Профиль</span>
        </button>
      </div>
    </nav>
  </div>
  {% csrf_token %}
  <script src="{% static 'js/miniapp-i18n.js' %}?v=bot12"></script>
  <script src="{% static 'js/miniapp-onboarding.js' %}?v=2"></script>
  <script src="{% static 'js/miniapp.js' %}?v=bot15"></script>
</body>
</html>
