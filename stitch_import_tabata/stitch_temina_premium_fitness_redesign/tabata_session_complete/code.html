<!DOCTYPE html>

<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100;300;800;900&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .soul-orb-glow {
            box-shadow: 0 0 120px 20px rgba(255, 107, 0, 0.4);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .stats-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes subtle-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .animate-pulse-slow {
            animation: subtle-pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#5f5e60",
                        "secondary-fixed": "#e5e1e4",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f4f2fc",
                        "tertiary-fixed": "#d0e4ff",
                        "primary-fixed-dim": "#ffb693",
                        "tertiary-container": "#059eff",
                        "on-secondary-fixed-variant": "#474649",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#c8c6c8",
                        "on-tertiary-fixed-variant": "#00497b",
                        "surface": "#fbf8ff",
                        "error-container": "#ffdad6",
                        "surface-tint": "#a04100",
                        "error": "#ba1a1a",
                        "inverse-surface": "#2f3037",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#572000",
                        "primary-fixed": "#ffdbcc",
                        "surface-container-highest": "#e3e1eb",
                        "on-background": "#1a1b22",
                        "inverse-primary": "#ffb693",
                        "primary": "#a04100",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e9e7f1",
                        "surface-bright": "#fbf8ff",
                        "primary-container": "#ff6b00",
                        "on-tertiary": "#ffffff",
                        "background": "#fbf8ff",
                        "on-error": "#ffffff",
                        "on-surface": "#1a1b22",
                        "tertiary-fixed-dim": "#9ccaff",
                        "tertiary": "#0062a1",
                        "outline-variant": "#e2bfb0",
                        "on-primary-fixed-variant": "#7a3000",
                        "on-surface-variant": "#5a4136",
                        "on-primary-fixed": "#351000",
                        "inverse-on-surface": "#f1eff9",
                        "surface-dim": "#dad9e2",
                        "on-tertiary-fixed": "#001d35",
                        "secondary-container": "#e5e1e4",
                        "on-tertiary-container": "#003357",
                        "outline": "#8e7164",
                        "on-secondary-container": "#656466",
                        "surface-container": "#efedf6",
                        "surface-variant": "#e3e1eb",
                        "on-secondary-fixed": "#1b1b1d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "gutter-grid": "16px",
                        "stack-sm": "8px",
                        "stack-lg": "32px",
                        "margin-page": "24px",
                        "section-gap": "48px"
                    },
                    "fontFamily": {
                        "display-metric": ["lexend"],
                        "caption-pill": ["manrope"],
                        "body-secondary": ["manrope"],
                        "headline-lg-mobile": ["lexend"],
                        "section-title": ["manrope"],
                        "headline-lg": ["lexend"],
                        "body-main": ["manrope"]
                    },
                    "fontSize": {
                        "display-metric": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "900" }],
                        "caption-pill": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "body-secondary": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "800" }],
                        "section-title": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "headline-lg": ["34px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "800" }],
                        "body-main": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#0A0A0F] text-white font-body-main min-h-screen overflow-hidden">
<!-- Background Layer: Simulated Blurred Camera Frame -->
<div class="fixed inset-0 z-0">
<img alt="Background" class="w-full h-full object-cover blur-2xl opacity-40 scale-110" data-alt="A blurred high-performance athletic environment with gym equipment and dynamic shadows in a high-end training facility. The lighting is moody and focused, with deep contrasts and a professional sports aesthetic. The overall mood is one of quiet achievement and post-workout serenity in a premium fitness space." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDJD23uQrcB75OE7l8RWaVwoGgL842avBP-E0ZFFK83kGFfo8vmCtRdU8MRDsWZMmlnM_5w-5n-i3xPBdzTT9bwxrcDK8TZNagkSdbL-HiUKVPPvOYdwz3iGZo_stWoXsr3Nnn2Gtk1TK7wIzt2a-hGyxV85fJqGu5gURFyyZJh1esKdEEsKMiBis2R7sKjYw8ui4mp12Y5iJn11xNaYyjLoTEG9am5NeW14HQI0lQV4VjN_GGwTyzoRBPX6krI5k6VX4FCeuSJFzfE"/>
<div class="absolute inset-0 bg-[#0A0A0F] opacity-75"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-margin-page py-stack-lg text-center">
<!-- Soul Orb Section -->
<div class="relative mb-stack-lg">
<div class="w-3 h-3 bg-primary-container rounded-full soul-orb-glow animate-pulse-slow"></div>
</div>
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-light tracking-wide mb-stack-md opacity-90">
            Завершено
        </h1>
<!-- Hero Metric -->
<div class="flex flex-col items-center mb-stack-lg">
<div class="flex items-baseline gap-2">
<span class="font-display-metric text-[72px] font-thin text-primary-container leading-none">284</span>
<span class="font-caption-pill text-secondary-fixed opacity-60 text-lg uppercase tracking-widest">kcal</span>
</div>
</div>
<!-- Hairline Divider -->
<div class="w-12 h-[1px] bg-white opacity-20 mb-stack-lg"></div>
<!-- Stats Row: Micro-pills -->
<div class="flex flex-wrap justify-center gap-stack-sm mb-section-gap">
<div class="stats-pill px-4 py-2 rounded-full flex items-center gap-2">
<span class="font-section-title text-body-main">156</span>
<span class="font-caption-pill text-[10px] text-secondary-fixed-dim uppercase opacity-50">повторов</span>
</div>
<div class="stats-pill px-4 py-2 rounded-full flex items-center gap-2">
<span class="font-section-title text-body-main">45</span>
<span class="font-caption-pill text-[10px] text-secondary-fixed-dim uppercase opacity-50">сек планки</span>
</div>
<div class="stats-pill px-4 py-2 rounded-full flex items-center gap-2">
<span class="font-section-title text-body-main">14</span>
<span class="font-caption-pill text-[10px] text-secondary-fixed-dim uppercase opacity-50">мин.</span>
</div>
</div>
<!-- AI Insights Badge -->
<div class="flex flex-col items-center gap-1 mb-section-gap group transition-all duration-300 hover:scale-105">
<div class="glass-card flex items-center gap-2 px-3 py-1.5 rounded-full">
<div class="w-1.5 h-1.5 rounded-full bg-primary-container"></div>
<span class="font-caption-pill text-white text-[11px] tracking-wider font-bold">AI 82%</span>
</div>
<p class="font-caption-pill text-[10px] text-secondary-fixed-dim opacity-40 uppercase tracking-[0.2em] mt-2">
                по интенсивности AI
            </p>
</div>
<!-- Actions Cluster -->
<div class="w-full max-w-xs flex flex-col gap-stack-md mt-auto pb-8">
<button class="w-full h-14 bg-primary-container text-white rounded-full font-section-title text-body-main transition-transform active:scale-95 duration-200">
                Готово
            </button>
<button class="w-full h-12 bg-transparent text-white opacity-40 hover:opacity-100 font-caption-pill text-body-secondary transition-all active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">share</span>
                Поделиться
            </button>
</div>
</main>
<!-- Subtle Scanline effect for "High-End Athletic Tool" feel -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-50 overflow-hidden">
<div class="absolute inset-0" style="background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 4px, 3px 100%;"></div>
</div>
<script>
        // Micro-interaction: Add a subtle parallax to the background on mouse move or orientation change
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            const bg = document.querySelector('img');
            if(bg) {
                bg.style.transform = `scale(1.1) translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Haptic simulation on CTA press
        const cta = document.querySelector('button');
        cta.addEventListener('touchstart', () => {
            if (window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        });
    </script>
</body></html>
