<!DOCTYPE html>

<html class="light" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Temina - Active Training Session</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&amp;family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#e5e1e4",
                        "surface-tint": "#a04100",
                        "on-primary-container": "#572000",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#ffdbcc",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "secondary": "#5f5e60",
                        "on-surface-variant": "#5a4136",
                        "on-secondary-fixed": "#1b1b1d",
                        "surface-dim": "#dad9e2",
                        "inverse-on-surface": "#f1eff9",
                        "surface-variant": "#e3e1eb",
                        "on-secondary-container": "#656466",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#ffb693",
                        "surface-container-high": "#e9e7f1",
                        "on-tertiary-container": "#003357",
                        "tertiary": "#0062a1",
                        "tertiary-container": "#059eff",
                        "background": "#fbf8ff",
                        "outline-variant": "#e2bfb0",
                        "outline": "#8e7164",
                        "on-tertiary-fixed": "#001d35",
                        "inverse-surface": "#2f3037",
                        "primary-fixed-dim": "#ffb693",
                        "secondary-fixed": "#e5e1e4",
                        "secondary-fixed-dim": "#c8c6c8",
                        "surface-container-highest": "#e3e1eb",
                        "on-tertiary-fixed-variant": "#00497b",
                        "surface-bright": "#fbf8ff",
                        "tertiary-fixed-dim": "#9ccaff",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f4f2fc",
                        "tertiary-fixed": "#d0e4ff",
                        "surface-container": "#efedf6",
                        "primary-container": "#ff6b00",
                        "error": "#ba1a1a",
                        "surface": "#fbf8ff",
                        "on-background": "#1a1b22",
                        "on-surface": "#1a1b22",
                        "on-primary-fixed": "#351000",
                        "primary": "#a04100",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#7a3000",
                        "on-secondary-fixed-variant": "#474649",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "margin-page": "24px",
                        "gutter-grid": "16px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "section-gap": "48px"
                    },
                    "fontFamily": {
                        "section-title": ["manrope"],
                        "body-secondary": ["manrope"],
                        "headline-lg": ["lexend"],
                        "display-metric": ["lexend"],
                        "headline-lg-mobile": ["lexend"],
                        "caption-pill": ["manrope"],
                        "body-main": ["manrope"]
                    },
                    "fontSize": {
                        "section-title": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
                        "body-secondary": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-lg": ["34px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "800"}],
                        "display-metric": ["48px", {"lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "900"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "800"}],
                        "caption-pill": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                        "body-main": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #fbf8ff;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-main text-on-background selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Overall Session Progress Bar (Subtle & Fixed) -->
<div class="fixed top-0 left-0 w-full h-1.5 bg-secondary-container z-[60]">
<div class="h-full bg-primary-container w-[65%] transition-all duration-700 ease-out"></div>
</div>
<!-- Top Navigation Anchor (Manual suppression of default shared Nav for Task-Focused UI) -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface/80 backdrop-blur-md px-margin-page py-4 flex justify-between items-center max-w-7xl mx-auto mt-1.5">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<div class="flex flex-col items-center">
<span class="font-caption-pill text-caption-pill text-secondary uppercase tracking-widest">Упражнение 4/12</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface">volume_up</span>
</button>
</header>
<main class="min-h-screen pt-20 pb-40 flex flex-col items-center">
<!-- Active Exercise Visual Focus -->
<section class="w-full max-w-2xl px-margin-page flex-grow flex flex-col items-center justify-center gap-stack-lg">
<div class="relative w-full aspect-[4/3] rounded-[24px] overflow-hidden bg-surface-container border border-outline-variant shadow-sm group">
<img class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" data-alt="A professional male athlete in premium charcoal fitness wear performing perfect pushups on a minimalist concrete floor. The lighting is dramatic and high-contrast, coming from a large side window, creating sharp shadows that emphasize muscle definition. The gym environment is ultra-clean with white walls and vast whitespace, reflecting a premium athletic tool aesthetic. The color palette is strictly neutrals with small high-visibility orange details on the gear." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBw-ChxMw_Q0tg0XzWd4mna2KLRJ4xQzhBYa3BM8H-P1FZvvmgiDLVyilREenJkDvt8JsxQbEABCHXvfggjoJRMFV0rrOWG23lnAkUucksKh_GUyvcFKjrL7mLkAbd1jaTrk9dd-eDh8FnwG9Qg55ItSBlRCdsmn7w0nT7EmZT9YIdltvwXKERaSvr3YLDYFy0XJFhVIWlO1HvpccrhHe_kCemsiq8EbBq-gdwV4JvNmkuKeLCa9BKjVOSUALXm33O0sQen-GnlFbHB"/>
<!-- Badge for exercise type -->
<div class="absolute top-4 left-4 bg-on-background/90 text-surface px-3 py-1.5 rounded-full font-caption-pill text-caption-pill backdrop-blur-sm">
                    Собственный вес
                </div>
</div>
<!-- Exercise Title and Metrics -->
<div class="text-center w-full animate-fade-in">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-stack-sm text-on-surface">Отжимания</h1>
<div class="flex items-center justify-center gap-stack-md mt-stack-md">
<!-- Primary Metric: Timer or Reps -->
<div class="bg-surface-container-low px-8 py-6 rounded-[24px] border border-secondary-container min-w-[160px] active:scale-95 transition-transform">
<span class="block font-display-metric text-display-metric text-primary-container leading-none">12</span>
<span class="block font-caption-pill text-caption-pill text-secondary mt-1 uppercase">Повторений</span>
</div>
</div>
</div>
</section>
<!-- Fixed Bottom Control & Preview Center -->
<section class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-xl border-t border-secondary-container px-margin-page py-8 z-40">
<div class="max-w-xl mx-auto flex flex-col gap-stack-lg">
<!-- Controls Row -->
<div class="flex items-center justify-between gap-gutter-grid">
<button class="flex-1 h-16 rounded-full bg-secondary-container/50 text-on-surface font-section-title text-section-title flex items-center justify-center gap-2 hover:bg-secondary-container active:scale-[0.98] transition-all">
<span class="material-symbols-outlined">skip_previous</span>
</button>
<button class="w-24 h-24 rounded-full bg-primary-container text-white flex items-center justify-center shadow-xl shadow-primary-container/20 hover:opacity-90 active:scale-[0.95] transition-all">
<span class="material-symbols-outlined !text-4xl" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="flex-1 h-16 rounded-full bg-primary-fixed text-on-primary-fixed-variant font-section-title text-section-title flex items-center justify-center gap-2 hover:bg-primary-fixed/80 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined">skip_next</span>
</button>
</div>
<!-- Next Exercise Preview -->
<div class="flex items-center justify-between bg-surface-container-high/50 p-4 rounded-xl active:scale-[0.98] transition-all cursor-pointer">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-lg overflow-hidden bg-outline-variant">
<img class="w-full h-full object-cover" data-alt="Close up of an athlete's legs in high-end athletic sneakers performing a squat against a pristine white studio background. The style is ultra-minimalist with a professional fitness catalog feel. Lighting is soft and even, highlighting the technical fabrics of the apparel." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFFz_x1eu51rpWSHGNNc_PLRK-NNPYKZfSbJtnBSunrSSGGDt0bFIbH4AuTXx4LwrYKO-5Jnq6BZAKFtWk6MWzPNqZnLN-G4-GdbTQGJGeIhncY6-Lhkhqd-sTdMcXLfa8HlMkoapZv1KdR7p4IfVY0NlQC-GTnSjIcrKM1OqmH0QWoOr6319N8seunA-tW9w6cQ2ILeIrHBiP4CFYignJFNLfAe7bc6vfVSs0ot7qn31-_Yg12RN7btp5LqgiciLhTd8kcH8GiLWz"/>
</div>
<div>
<span class="block font-caption-pill text-caption-pill text-secondary uppercase">Следующее</span>
<span class="block font-body-main text-body-main font-bold text-on-surface">Приседания</span>
</div>
</div>
<span class="material-symbols-outlined text-secondary">chevron_right</span>
</div>
</div>
</section>
</main>
<!-- Contextual FAB Suppression: FAB is not rendered for active session focus -->
</body></html>
