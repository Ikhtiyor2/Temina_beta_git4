<!DOCTYPE html>

<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;800;900&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-container": "#e5e1e4",
                    "surface-tint": "#a04100",
                    "on-primary-container": "#572000",
                    "on-tertiary": "#ffffff",
                    "primary-fixed": "#ffdbcc",
                    "on-error-container": "#93000a",
                    "on-secondary": "#ffffff",
                    "secondary": "#5f5e60",
                    "on-surface-variant": "#5a4136",
                    "on-secondary-fixed": "#1b1b1d",
                    "surface-dim": "#dad9e2",
                    "inverse-on-surface": "#f1eff9",
                    "surface-variant": "#e3e1eb",
                    "on-secondary-container": "#656466",
                    "surface-container-lowest": "#ffffff",
                    "inverse-primary": "#ffb693",
                    "surface-container-high": "#e9e7f1",
                    "on-tertiary-container": "#003357",
                    "tertiary": "#0062a1",
                    "tertiary-container": "#059eff",
                    "background": "#fbf8ff",
                    "outline-variant": "#e2bfb0",
                    "outline": "#8e7164",
                    "on-tertiary-fixed": "#001d35",
                    "inverse-surface": "#2f3037",
                    "primary-fixed-dim": "#ffb693",
                    "secondary-fixed": "#e5e1e4",
                    "secondary-fixed-dim": "#c8c6c8",
                    "surface-container-highest": "#e3e1eb",
                    "on-tertiary-fixed-variant": "#00497b",
                    "surface-bright": "#fbf8ff",
                    "tertiary-fixed-dim": "#9ccaff",
                    "on-primary": "#ffffff",
                    "surface-container-low": "#f4f2fc",
                    "tertiary-fixed": "#d0e4ff",
                    "surface-container": "#efedf6",
                    "primary-container": "#ff6b00",
                    "error": "#ba1a1a",
                    "surface": "#fbf8ff",
                    "on-background": "#1a1b22",
                    "on-surface": "#1a1b22",
                    "on-primary-fixed": "#351000",
                    "primary": "#a04100",
                    "error-container": "#ffdad6",
                    "on-primary-fixed-variant": "#7a3000",
                    "on-secondary-fixed-variant": "#474649",
                    "on-error": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-sm": "8px",
                    "margin-page": "24px",
                    "gutter-grid": "16px",
                    "stack-md": "16px",
                    "stack-lg": "32px",
                    "section-gap": "48px"
            },
            "fontFamily": {
                    "section-title": ["manrope"],
                    "body-secondary": ["manrope"],
                    "headline-lg": ["lexend"],
                    "display-metric": ["lexend"],
                    "headline-lg-mobile": ["lexend"],
                    "caption-pill": ["manrope"],
                    "body-main": ["manrope"]
            },
            "fontSize": {
                    "section-title": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
                    "body-secondary": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg": ["34px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "800"}],
                    "display-metric": ["48px", {"lineHeight": "52px", "letterSpacing": "-0.02em", "fontWeight": "900"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "800"}],
                    "caption-pill": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "body-main": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .map-gradient-overlay {
            background: linear-gradient(to bottom, rgba(26, 27, 34, 0.4) 0%, rgba(26, 27, 34, 0) 20%, rgba(26, 27, 34, 0) 70%, rgba(26, 27, 34, 0.95) 100%);
        }
        .pulse-indicator {
            box-shadow: 0 0 0 0 rgba(255, 107, 0, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 107, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(255, 107, 0, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 107, 0, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-main antialiased overflow-hidden h-screen w-full">
<!-- Top Navigation Bar (Suppressed because focused task, but keeping Brand Identity via Floating Header) -->
<header class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-margin-page py-4 pointer-events-none">
<div class="bg-surface/80 backdrop-blur-md rounded-full px-4 py-2 border border-secondary-container pointer-events-auto flex items-center gap-2">
<span class="material-symbols-outlined text-primary">navigation</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Temina</span>
</div>
<div class="bg-surface/80 backdrop-blur-md h-12 w-12 rounded-full border border-secondary-container pointer-events-auto flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface">settings</span>
</div>
</header>
<!-- Main Map Canvas -->
<main class="relative h-screen w-full bg-on-background">
<!-- Mock Map Background -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-60 grayscale brightness-75" data-alt="A dark-themed high-contrast satellite map view of a modern urban neighborhood at night. The map features deep charcoal roads and dark grey building silhouettes. A vibrant, glowing orange polyline traces a complex running route through the grid, creating a striking professional athletic aesthetic. Minimalist iconography and a soft ambient glow suggest a premium fitness tracking experience." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCnTV7uvD-vzS2hd6NY0penE94rcCFZ5OSdTREZY1IwgS3fofCRC1jyLXPPKxKseawKHJHUWjhY8guL8IrYpfSRpMHpDvc6v8icP1pq0qp1OzTCOa3qf5eXqBT1ro1bjrx7u_mW40Qpp6giO0KLBYlxfziCocQPqtGLK-bpBFfEUNQEtgedo80rJVOeT4M06Za_qI8WcuXRerHYGdNejtSK5_-zQVP3L7fWOiAflEKyKO7dcWpZfEH_SL6LXQk5B1AznBi0ZCpBzw2g"/>
<div class="absolute inset-0 map-gradient-overlay"></div>
<!-- Pulse User Location -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10">
<div class="pulse-indicator w-5 h-5 bg-primary-container rounded-full ring-4 ring-white/20"></div>
</div>
</div>
<!-- Floating High-Contrast Metrics -->
<div class="absolute top-24 left-margin-page right-margin-page z-20 flex justify-center">
<div class="bg-on-background/90 backdrop-blur-xl border border-white/10 rounded-2xl p-6 w-full max-w-md shadow-2xl">
<div class="flex flex-col items-center">
<span class="text-secondary-fixed-dim font-caption-pill text-caption-pill mb-1">Дистанция</span>
<div class="flex items-baseline gap-1">
<span class="text-white font-display-metric text-display-metric">5.42</span>
<span class="text-secondary-fixed-dim font-section-title text-section-title uppercase">км</span>
</div>
</div>
<div class="grid grid-cols-2 gap-stack-lg mt-stack-lg pt-stack-lg border-t border-white/10">
<div class="flex flex-col items-center">
<span class="text-secondary-fixed-dim font-caption-pill text-caption-pill mb-1 uppercase">Темп</span>
<span class="text-white font-section-title text-section-title">04:45</span>
<span class="text-secondary-fixed-dim text-[10px] font-body-secondary">мин/км</span>
</div>
<div class="flex flex-col items-center">
<span class="text-secondary-fixed-dim font-caption-pill text-caption-pill mb-1 uppercase">Время</span>
<span class="text-white font-section-title text-section-title">00:24:15</span>
<span class="text-secondary-fixed-dim text-[10px] font-body-secondary">час:мин:сек</span>
</div>
</div>
</div>
</div>
<!-- Bottom Controls Panel -->
<div class="absolute bottom-0 left-0 right-0 z-30 pb-safe px-margin-page">
<div class="bg-surface rounded-t-[32px] p-stack-lg flex flex-col items-center shadow-[0_-8px_40px_rgba(0,0,0,0.1)]">
<!-- Secondary Metrics Row -->
<div class="w-full flex justify-around mb-stack-lg px-4">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-primary mb-1">local_fire_department</span>
<span class="font-section-title text-section-title text-on-surface">342</span>
<span class="text-secondary font-body-secondary text-caption-pill uppercase">ккал</span>
</div>
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-tertiary mb-1">favorite</span>
<span class="font-section-title text-section-title text-on-surface">158</span>
<span class="text-secondary font-body-secondary text-caption-pill uppercase">уд/мин</span>
</div>
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-on-surface-variant mb-1">height</span>
<span class="font-section-title text-section-title text-on-surface">12</span>
<span class="text-secondary font-body-secondary text-caption-pill uppercase">подъем (м)</span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-gutter-grid w-full">
<!-- Pause Button -->
<button class="flex-1 bg-secondary-fixed h-16 rounded-full flex items-center justify-center gap-2 active:scale-95 transition-all duration-200 group">
<span class="material-symbols-outlined text-on-secondary-fixed">pause_circle</span>
<span class="font-section-title text-section-title text-on-secondary-fixed">Пауза</span>
</button>
<!-- Finish Button -->
<button class="flex-[1.2] bg-primary-container h-16 rounded-full flex items-center justify-center gap-2 active:scale-95 transition-all duration-200 shadow-lg shadow-primary-container/20">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">stop_circle</span>
<span class="font-section-title text-section-title text-white">Финиш</span>
</button>
</div>
<!-- Swipe Indicator -->
<div class="mt-stack-md w-12 h-1.5 bg-secondary-container rounded-full opacity-50"></div>
</div>
</div>
</main>
<!-- Side Map Controls -->
<div class="fixed right-margin-page top-1/2 -translate-y-1/2 z-40 flex flex-col gap-stack-md">
<button class="h-12 w-12 bg-on-background/80 backdrop-blur-md rounded-full border border-white/10 flex items-center justify-center text-white active:scale-95 transition-transform">
<span class="material-symbols-outlined">my_location</span>
</button>
<button class="h-12 w-12 bg-on-background/80 backdrop-blur-md rounded-full border border-white/10 flex items-center justify-center text-white active:scale-95 transition-transform">
<span class="material-symbols-outlined">layers</span>
</button>
<button class="h-12 w-12 bg-on-background/80 backdrop-blur-md rounded-full border border-white/10 flex items-center justify-center text-white active:scale-95 transition-transform">
<span class="material-symbols-outlined">music_note</span>
</button>
</div>
</body></html>
