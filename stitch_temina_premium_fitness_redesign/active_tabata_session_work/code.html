<!-- Interaction Script -->
<script>
        // Simple haptic-like scale down effect for the close button
        const closeBtn = document.querySelector('button');
        closeBtn.addEventListener('touchstart', () => {
            closeBtn.style.transform = 'scale(0.92)';
        });
        closeBtn.addEventListener('touchend', () => {
            closeBtn.style.transform = 'scale(1)';
        });
        
        // Mock countdown logic visual update
        let seconds = 12;
        const timerElement = document.querySelector('.font-display-metric');
        setInterval(() => {
            if(seconds > 0) {
                seconds--;
                timerElement.innerText = seconds;
            }
        }, 1000);
    </script>
